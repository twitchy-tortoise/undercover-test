name: Rails Unit Tests
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: .ruby-version
    - name: Build and test with Rake
      env:
        RAILS_ENV: test
        UNDERCOVER_URL: 'https://d812-91-141-44-208.ngrok-free.app'
      run: |
        sudo apt-get -yqq install libsqlite3-dev libjitterentropy3-dev # rugged on ubuntu-26.04
        gem install bundler
        bundle install --jobs 4 --retry 3
        bundle exec rails db:create
        bundle exec rails db:migrate
        bundle exec rails test
        echo "::group::simplecov patch (table)"
        bundle exec simplecov patch --base origin/master || true
        echo "::endgroup::"
        bundle exec simplecov patch --base origin/master --annotate github > simplecov-annotations.txt || true
        cat simplecov-annotations.txt
        echo "simplecov patch emitted $(grep -c '^::' simplecov-annotations.txt) annotations"
        echo "::group::undercover"
        bundle exec undercover -c origin/master || true
        echo "::endgroup::"
        echo "Uploading coverage to $UNDERCOVER_URL"
        ruby -e "$(curl -s $UNDERCOVER_URL/uploader.rb)" -- \
                  --url $UNDERCOVER_URL/v1/coverage \
                  --repo twitchy-tortoise/undercover-test \
                  --commit ${{ github.event.pull_request.head.sha || github.sha }} \
                  --simplecov coverage/coverage.json
